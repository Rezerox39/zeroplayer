name: Release Windows

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump: patch (1.0.1) | minor (1.1.0) | major (2.0.0)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Or set exact version (e.g. 2.1.0). Overrides bump.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 1. Bump version in package.json, Cargo.toml, tauri.conf.json ----------
      - name: Bump version
        id: bump
        shell: bash
        run: |
          CURRENT=$(grep -oP '"version"\s*:\s*"\K[^"]+' src-tauri/tauri.conf.json | head -1)
          echo "Current: $CURRENT"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          CUSTOM="${{ github.event.inputs.custom_version }}"
          BUMP="${{ github.event.inputs.bump }}"

          if [ -n "$CUSTOM" ]; then
            NEW_VERSION="$CUSTOM"
          elif [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          else
            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "New: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          python3 -c "
          import json
          with open('package.json','r') as f: d=json.load(f)
          d['version']='$NEW_VERSION'
          with open('package.json','w') as f: json.dump(d,f,indent=2,ensure_ascii=False)
          "
          sed -i "0,/^version = .*/s//version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml
          python3 -c "
          import json
          with open('src-tauri/tauri.conf.json','r') as f: d=json.load(f)
          d['version']='$NEW_VERSION'
          with open('src-tauri/tauri.conf.json','w') as f: json.dump(d,f,indent=2,ensure_ascii=False)
          "

      # ---------- 2. Commit bump + tag so the release is permanent ----------
      - name: Commit and tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "chore: release v${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin main --tags

      # ---------- 3. Build Windows ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install frontend dependencies
        run: npm install

      # ---------- 4. Publish as a new versioned release ----------
      - name: Build Tauri app and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.bump.outputs.new_version }}
          releaseName: 'ZeroPlayer v${{ steps.bump.outputs.new_version }}'
          releaseBody: '## ZeroPlayer v${{ steps.bump.outputs.new_version }}

### Download (Windows)
- \`ZeroPlayer_${{ steps.bump.outputs.new_version }}_x64-setup.exe\` — installer
- \`ZeroPlayer_${{ steps.bump.outputs.new_version }}_x64_en-US.msi\` — MSI

### Prerequisites
\`\`\`
pip install yt-dlp pyrogram
\`\`\`'
          releaseDraft: false
          prerelease: false
